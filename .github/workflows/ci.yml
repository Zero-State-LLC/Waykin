name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Add your project's dependencies here, e.g.:
        # pip install -r requirements.txt
    - name: Run tests
      run: |
        # Add your test command here, e.g.:
        # pytest

  # TypeScript core: parity tests against the committed Swift-generated vectors,
  # plus a check that the synced Lens copy of the core is not stale.
  # Runs in parallel with swift-vectors on purpose: it must be meaningful even
  # when the vector jobs are red, so it never declares `needs`.
  ts-core-parity:
    name: TypeScript core parity + Lens sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/waykin-core-ts/package-lock.json

      - name: Install dependencies
        working-directory: packages/waykin-core-ts
        run: npm ci

      - name: Typecheck
        working-directory: packages/waykin-core-ts
        run: npm run typecheck

      - name: Typecheck ES2019 Lens source
        working-directory: packages/waykin-core-ts
        run: npm run typecheck:lens

      - name: Isolation check (no Lens imports)
        working-directory: packages/waykin-core-ts
        run: npm run isolation

      - name: Require all parity vector families
        run: echo "WAYKIN_REQUIRE_VECTORS=1" >> "$GITHUB_ENV"

      - name: Test
        working-directory: packages/waykin-core-ts
        run: npm test

      - name: Verify the Lens core copy is in sync
        run: bash scripts/sync_core_ts.sh --check

  # Vector generation alone does not execute Swift regression tests (#25).
  swift-core-validation:
    name: Swift build, regression tests and repository validation
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Swift version
        run: swift --version
      - name: Build Swift package
        run: make build
      - name: Test Swift package
        run: make test
      - name: Validate repository
        run: make validate

  # Swift side: regenerate all vector families, prove they are committed and
  # fresh, and always publish them for debugging.
  swift-vectors:
    name: Swift core parity vectors
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Generate vectors
        run: make vectors

      - name: Verify committed vectors are fresh
        run: git diff --exit-code -- Tests/Vectors

      - name: Fail on untracked files under Tests/Vectors
        run: |
          untracked="$(git status --porcelain -- Tests/Vectors | sed -n 's/^?? //p')"
          if [ -n "$untracked" ]; then
            echo "::error::Untracked files under Tests/Vectors must be committed."
            echo "$untracked"
            exit 1
          fi
          echo "No untracked files under Tests/Vectors."

      - name: Upload core parity vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-parity-vectors
          path: Tests/Vectors
          if-no-files-found: warn
          retention-days: 7
