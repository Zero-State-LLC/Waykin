name: CodeQL

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze
    # Org hosted minutes are payment-blocked. Use the Mac mini
    # ([self-hosted, macOS]); do not add ios or this steals air-ios.
    runs-on: [self-hosted, macOS]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        language: [javascript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
